# OCR configuration for Russian GRZ characters
# Allowed letters (shared Cyrillic/Latin glyphs): A B E K M H O P C T Y X
charset: "0123456789ABEKMHOPCTYX#"
dict_path: configs/ocr_dict.txt
plate_mask: "^[ABEKMHOPCTYX#][0-9#]{3}[ABEKMHOPCTYX#]{2}([0-9#]{2}|[127][0-9#]{2})$"

# RapidOCR / Paddle rec heads bake the full charset into ONNX output indices.
# Feeding a truncated dict.txt without fine-tuning remaps logits incorrectly.
# Runtime restriction is post-decode via src/utils/plate_mask.py (and min_char_conf → #).
# TODO(stage later): fine-tune rec head on CHARSET so the ONNX dict can be truncated.
dict_truncation: postfilter_only

# Warp output sizes come from src.utils.geometry.warp_size (mm * scale), not from here.
# type1a: flatten = warp each line by sub-quads then stitch horizontally (CRNN);
#         stacked = one warp of the full 2-row rectangle.
type1a_mode: flatten
warp_scale: 0.8

# Per-character OCR score below this is replaced with '#'
min_char_conf: 0.35

# Combine detector bbox score with min(char OCR scores):
#   det_ocr_min | min | mean | det_ocr_mean
confidence_mode: det_ocr_min

# Baseline candidates (switch by name in benchmark_latency.py / pipeline)
baselines:
  - name: ppocrv4_mobile
    engine: rapidocr_onnx
    ocr_version: PP-OCRv4
  - name: ppocrv5_mobile
    engine: rapidocr_onnx
    ocr_version: PP-OCRv5
  - name: parseq
    engine: parseq_onnx
    weights: weights/ocr/parseq.onnx

parseq_weights: weights/ocr/parseq.onnx
# Vendored RapidOCR English rec (offline). Copied at setup, never downloaded at inference.
rec_weights: weights/ocr/en_PP-OCRv4_rec_mobile.onnx
rec_weights_by_backend:
  ppocrv4_mobile: weights/ocr/en_PP-OCRv4_rec_mobile.onnx
  ppocrv5_mobile: weights/ocr/en_PP-OCRv5_rec_mobile.onnx

# Active OCR for the legacy `--prefer-onnx` fallback (not the default engine).
# Leakage-aware full-pipeline evaluation used n=1,219 readable GT.
# With predicted YOLO26n boxes, v5 reached 24.77% end-to-end exact vs 23.95%
# for the validation-selected v4/v5 type router, and was faster on this CPU.
# Absolute quality is limited by bbox rectification. The default pose+CRNN
# engine is configured in configs/pipeline.yaml; see the selection report.
active: ppocrv5_mobile

# Training (fine-tune on plate crops) — not part of Stage 5 inference
train:
  epochs: 30
  batch: 32
  lr: 0.001
  seed: 42
  imgsz: [96, 416]
