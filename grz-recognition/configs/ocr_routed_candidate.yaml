# Candidate selected on the 2026-09-27 Kaggle validation experiment.
# Keep configs/ocr.yaml as the production default until this routing policy is
# confirmed on an independent, leakage-free real test set for every plate type.
charset: "0123456789ABEKMHOPCTYX#"
dict_path: configs/ocr_dict.txt
plate_mask: "^[ABEKMHOPCTYX#][0-9#]{3}[ABEKMHOPCTYX#]{2}([0-9#]{2}|[127][0-9#]{2})$"

type1a_mode: flatten
warp_scale: 0.8
min_char_conf: 0.35
confidence_mode: det_ocr_min

# On GT quadrilaterals, type-aware routing improved exact validation accuracy
# from 40.94% to 45.28%. It is NOT the deployment winner: with predicted boxes,
# universal PP-OCRv5 scored 24.77% vs 23.95% for this route. Keep for analysis.
active: ppocrv5_mobile
active_by_plate_type:
  type1: ppocrv4_mobile
  type1a: ppocrv5_mobile
  type1b: ppocrv4_mobile
  other: ppocrv4_mobile

rec_weights_by_backend:
  ppocrv4_mobile: weights/ocr/en_PP-OCRv4_rec_mobile.onnx
  ppocrv5_mobile: weights/ocr/en_PP-OCRv5_rec_mobile.onnx
